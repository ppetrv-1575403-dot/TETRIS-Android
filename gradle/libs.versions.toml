[versions]
activityComposeVersion = "1.13.0"
agp = "9.2.0"
composeBomVersion = "2026.04.01"
coreKtx = "1.18.0"
hiltVersion = "2.59.2"
hiltNavigationCompose = "1.3.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
kotlinxCoroutinesAndroid = "1.10.2"
lifecycleRuntimeCompose = "2.10.0"
